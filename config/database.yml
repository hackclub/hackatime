default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 50 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    url: <%= ENV['DATABASE_URL'] %>
  sailors_log:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['SAILORS_LOG_DATABASE_URL'] %>
    replica: true
  clickhouse:
    adapter: clickhouse
    host: <%= ENV.fetch("CLICKHOUSE_HOST", "clickhouse") %>
    port: <%= ENV.fetch("CLICKHOUSE_PORT", 8123) %>
    database: <%= ENV.fetch("CLICKHOUSE_DATABASE", "hackatime_development") %>
    username: <%= ENV.fetch("CLICKHOUSE_USER", "default") %>
    password: <%= ENV.fetch("CLICKHOUSE_PASSWORD", "") %>
    migrations_paths: db/clickhouse
    # SQL structure dump (SHOW CREATE TABLE) instead of the Ruby schema dumper,
    # which lossily downgrades Float64->Float32 and FixedString->String. Postgres
    # keeps the default :ruby format.
    schema_format: sql

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    adapter: postgresql
    database: app_test
    url: <%= ENV['TEST_DATABASE_URL'] %>
  sailors_log:
    adapter: postgresql
    database: app_test
    url: <%= ENV['TEST_DATABASE_URL'] %>
    replica: true
  clickhouse:
    adapter: clickhouse
    host: <%= ENV.fetch("CLICKHOUSE_HOST", "clickhouse") %>
    port: <%= ENV.fetch("CLICKHOUSE_PORT", 8123) %>
    database: <%= ENV.fetch("CLICKHOUSE_TEST_DATABASE", "hackatime_test") %>
    username: <%= ENV.fetch("CLICKHOUSE_USER", "default") %>
    password: <%= ENV.fetch("CLICKHOUSE_PASSWORD", "") %>
    migrations_paths: db/clickhouse
    # See development note: SQL structure dump avoids the lossy Ruby dumper.
    schema_format: sql

# Store production database in the storage/ directory, which by default
# is mounted as a persistent Docker volume in config/deploy.yml.
production:
  primary:
    <<: *default
    adapter: postgresql
    encoding: unicode
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 16 }.to_i + 8 %> # Web threads + 8 GoodJob threads
    url: <%= ENV['POOL_DATABASE_URL'] %>
  sailors_log:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['SAILORS_LOG_DATABASE_URL'] %>
    replica: true
  cache:
    <<: *default
    adapter: postgresql
    encoding: unicode
    url: <%= ENV['DATABASE_URL'] %>
  cable:
    <<: *default
    adapter: sqlite3
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  clickhouse:
    adapter: clickhouse
    url: <%= ENV['CLICKHOUSE_URL'] %>
    migrations_paths: db/clickhouse
    schema_format: sql
    # Skip schema management (db:prepare etc.) until the production ClickHouse
    # deployment exists, so boot/deploy don't fail on a missing CLICKHOUSE_URL.
    database_tasks: <%= ENV["CLICKHOUSE_URL"].present? %>
