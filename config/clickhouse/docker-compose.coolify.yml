services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9.10.4
    restart: unless-stopped
    environment:
      - CLICKHOUSE_USER=hackatime
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=hackatime
      - CLICKHOUSE_BACKUP_S3_URL=${CLICKHOUSE_BACKUP_S3_URL}
      - CLICKHOUSE_BACKUP_S3_ACCESS_KEY=${CLICKHOUSE_BACKUP_S3_ACCESS_KEY}
      - CLICKHOUSE_BACKUP_S3_SECRET_KEY=${CLICKHOUSE_BACKUP_S3_SECRET_KEY}
      - CLICKHOUSE_BACKUP_S3_REGION=${CLICKHOUSE_BACKUP_S3_REGION}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: 28g
    memswap_limit: 28g
    cpus: 16
    volumes:
      - hackatime-clickhouse-data:/var/lib/clickhouse
      - type: bind
        source: ./config.d/hackatime.xml
        target: /etc/clickhouse-server/config.d/hackatime.xml
        read_only: true
        content: |
          <clickhouse>
              <max_server_memory_usage>25769803776</max_server_memory_usage>
              <logger><level>warning</level></logger>
              <backups>
                  <allow_concurrent_backups>false</allow_concurrent_backups>
                  <allow_concurrent_restores>false</allow_concurrent_restores>
              </backups>
              <s3>
                  <hackatime_backups>
                      <endpoint from_env="CLICKHOUSE_BACKUP_S3_URL"/>
                      <access_key_id from_env="CLICKHOUSE_BACKUP_S3_ACCESS_KEY"/>
                      <secret_access_key from_env="CLICKHOUSE_BACKUP_S3_SECRET_KEY"/>
                      <region from_env="CLICKHOUSE_BACKUP_S3_REGION"/>
                  </hackatime_backups>
              </s3>
              <prometheus>
                  <endpoint>/metrics</endpoint>
                  <port>9363</port>
                  <metrics>true</metrics>
                  <events>true</events>
                  <asynchronous_metrics>true</asynchronous_metrics>
              </prometheus>
          </clickhouse>
      - type: bind
        source: ./users.d/hackatime-v2.xml
        target: /etc/clickhouse-server/users.d/hackatime-v2.xml
        read_only: true
        content: |
          <clickhouse>
              <profiles>
                  <app>
                      <max_memory_usage>8589934592</max_memory_usage>
                      <max_execution_time>120</max_execution_time>
                      <max_threads>8</max_threads>
                      <async_insert>1</async_insert>
                      <wait_for_async_insert>1</wait_for_async_insert>
                      <async_insert_deduplicate>1</async_insert_deduplicate>
                      <max_bytes_before_external_group_by>4294967296</max_bytes_before_external_group_by>
                      <max_bytes_before_external_sort>4294967296</max_bytes_before_external_sort>
                      <allow_nonconst_timezone_arguments>0</allow_nonconst_timezone_arguments>
                      <aggregate_functions_null_for_empty>1</aggregate_functions_null_for_empty>
                  </app>
              </profiles>
              <users>
                  <hackatime>
                      <profile>app</profile>
                      <access_management>1</access_management>
                      <named_collection_control>1</named_collection_control>
                      <show_named_collections>1</show_named_collections>
                  </hackatime>
              </users>
          </clickhouse>
    healthcheck:
      # Unauthenticated ping, so no password ends up in `docker inspect`.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  hackatime-clickhouse-data:
